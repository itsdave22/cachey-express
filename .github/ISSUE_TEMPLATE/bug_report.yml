name: Bug report
description: Report a reproducible problem with @cachey/express
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include secrets, credentials, private URLs, or production data.

  - type: input
    id: version
    attributes:
      label: @cachey/express version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "e.g. 22.x"
    validations:
      required: true

  - type: input
    id: express
    attributes:
      label: Express version
      placeholder: "e.g. 5.x"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe code example or repository that reproduces the issue.
      render: javascript
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal or production data before posting.
      render: shell

  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier version?
      options:
        - Unknown
        - "Yes"
        - "No"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed secrets, credentials, and private production data.
          required: true
        - label: This is not a security vulnerability.
          required: true
